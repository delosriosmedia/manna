<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="alternate icon" type="image/png" href="/icono.png">
  <link rel="apple-touch-icon" href="/icono-180.png">
  <meta name="apple-mobile-web-app-title" content="Manna">
  <title>Manna · Vista previa de dispositivos</title>
  <link rel="stylesheet" href="/core/app.css">
  <style>
    body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--s1); }
    header h1 { margin-right: auto; }
    .seg { display: flex; gap: 4px; padding: 3px; background: var(--s2); border: 1px solid var(--line); border-radius: var(--r); }
    .seg button { padding: 5px 12px; border-radius: var(--r-sm); color: var(--ink-3); font-weight: 500; }
    .seg button.on { background: var(--s3); color: var(--ink); }
    #area { flex: 1; min-height: 0; display: grid; place-items: center; padding: 16px; overflow: hidden; }
    #device { background: #05070a; border: 10px solid #1c212c; border-radius: 34px; overflow: hidden; transform-origin: center; flex-shrink: 0; }
    #device.tablet { border-radius: 22px; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    #size { color: var(--ink-3); font: 500 12px var(--mono); }
  </style>
</head>
<body>
  <header>
    <h1>Vista previa de dispositivos</h1>
    <div class="seg" id="devices"></div>
    <div class="seg" id="roles"></div>
    <span id="size"></span>
  </header>
  <div id="area"><div id="device"><iframe title="Vista previa de Manna"></iframe></div></div>
  <script>
    // Herramienta de diseño: muestra la app real dentro del marco de un dispositivo, con datos reales.
    // La adaptación se decide por el ancho del marco, igual que en un dispositivo de verdad.
    const DEVICES = [
      { id: 'cel-v', name: 'Celular vertical', w: 390, h: 844 },
      { id: 'cel-h', name: 'Celular horizontal', w: 844, h: 390 },
      { id: 'tab-h', name: 'Tableta horizontal', w: 1024, h: 768, tablet: true },
      { id: 'tab-v', name: 'Tableta vertical', w: 768, h: 1024, tablet: true },
    ];
    const ROLES = [{ id: 'control', name: 'Control completo' }, { id: 'orden', name: 'Control del orden' }];
    const frame = document.querySelector('iframe');
    const device = document.querySelector('#device');
    const area = document.querySelector('#area');
    let current = DEVICES[0];
    let role = ROLES[0];

    function fit() {
      const scale = Math.min(1, (area.clientWidth - 32) / (current.w + 20), (area.clientHeight - 32) / (current.h + 20));
      device.style.width = `${current.w + 20}px`;
      device.style.height = `${current.h + 20}px`;
      device.style.transform = `scale(${scale})`;
      device.classList.toggle('tablet', Boolean(current.tablet));
      document.querySelector('#size').textContent = `${current.w} × ${current.h}${scale < 1 ? ` · al ${Math.round(scale * 100)} %` : ''}`;
    }
    function segment(el, items, isOn, pick) {
      el.replaceChildren(...items.map((item) => {
        const b = document.createElement('button');
        b.textContent = item.name;
        b.className = isOn(item) ? 'on' : '';
        b.onclick = () => { pick(item); render(); };
        return b;
      }));
    }
    function render() {
      segment(document.querySelector('#devices'), DEVICES, (d) => d === current, (d) => { current = d; });
      segment(document.querySelector('#roles'), ROLES, (r) => r === role, (r) => { role = r; frame.src = `/${r.id}?tactil`; });
      fit();
    }
    frame.src = `/${role.id}?tactil`;
    addEventListener('resize', fit);
    render();
  </script>
</body>
</html>
