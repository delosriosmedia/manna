<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="alternate icon" type="image/png" href="/icono.png">
  <link rel="apple-touch-icon" href="/icono-180.png">
  <meta name="apple-mobile-web-app-title" content="Manna">
  <title>Manna</title>
  <script>if (matchMedia('(pointer: coarse)').matches || /[?&]tactil/.test(location.search)) document.documentElement.classList.add('touch');</script>
  <!-- Tamaño de la interfaz de este dispositivo (Ajustes, 1.31), antes de dibujar nada; ?escala=1.08 lo fuerza (pruebas). -->
  <script>try { const z = Number(new URLSearchParams(location.search).get('escala')) || JSON.parse(localStorage.getItem('manna.interfaz.tamano')); if (z > 1 && z <= 1.08) document.documentElement.style.setProperty('--zoom', z); } catch {}</script>
  <link rel="stylesheet" href="/core/app.css">
  <style>
    /* Inicio: las funciones como tarjetas de cristal sobre el resplandor de la M. */
    main { max-width: 1040px; margin: 0 auto; padding: 56px 16px 40px; }
    header { margin-bottom: 28px; }
    .lockup img { width: 78px; filter: drop-shadow(0 0 22px rgba(0, 255, 255, 0.45)); }
    .lockup .wordmark { font-size: 18px; font-weight: 700; letter-spacing: 0.26em; }
    .lockup .version { margin-top: 2px; }
    header h1 { margin-top: 18px; font-size: clamp(26px, 6vw, 34px); font-weight: 800; letter-spacing: -0.01em; }
    #roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px; }
    .role { display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left; padding: 18px; background: var(--glass-1); border: 1px solid var(--glass-line); border-radius: var(--r-lg); -webkit-backdrop-filter: blur(var(--blur-1)); backdrop-filter: blur(var(--blur-1)); transition: border-color 0.15s var(--ease), transform 0.15s var(--ease); }
    .role:hover { border-color: rgba(92, 232, 255, 0.45); transform: translateY(-1px); }
    .role:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .role.current { border-color: var(--accent); }
    .role:disabled { opacity: 0.55; transform: none; border-color: var(--glass-line); cursor: default; }
    /* La portada de la nube (fase 37, parte 6): entrar al equipo de la iglesia, o saber que está apagado. */
    a.role { color: inherit; text-decoration: none; }
    .church-role { border-color: var(--accent); }
    .church-note { grid-column: 1 / -1; margin: 0 0 2px; color: var(--ink-3); font-size: 13px; }
    /* Instalar Manna en el equipo principal, desde la nube (decisión 64). */
    .install-choice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--glass-line); border-radius: var(--r); cursor: pointer; }
    .install-choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
    .install-choice input { margin-top: 3px; accent-color: var(--accent); }
    .install-choice span { display: grid; gap: 2px; }
    .install-choice small { color: var(--ink-3); font-size: 12px; }
    .install-warn { color: #f0bc66; }
    .install-after { color: var(--ink-2); font-size: 13px; }
    .role-icon { flex: 0 0 auto; width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
    .role-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .role-text strong { font-size: 16px; font-weight: 600; }
    .role-text span { color: var(--ink-2); font-size: 13px; line-height: 1.45; }
    .tag { flex: 0 0 auto; font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: var(--r-pill); color: var(--accent-hover); background: var(--accent-soft); white-space: nowrap; }
    .tag.asks { color: #f0bc66; background: rgba(240, 188, 102, 0.12); }
    #who { margin-top: 10px; color: var(--ink-3); font-size: 13px; }
    .free { margin-top: 28px; text-align: center; color: var(--ink-3); font-size: 12px; }
    .free a { color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
    .touch .free a { display: inline-block; min-height: var(--tap); line-height: var(--tap); }
    #who button { color: var(--accent); font: inherit; text-decoration: underline; text-underline-offset: 3px; }
    .touch #who button { min-height: var(--tap); padding: 0 4px; }

    /* Quién eres (fase 35): los nombres de quienes pueden usar esa función, para tocar el tuyo. */
    .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 10px; }
    .person { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px 12px; text-align: left; border: 1px solid var(--glass-line); border-radius: var(--r); background: rgba(255, 255, 255, 0.04); font-weight: 600; }
    .person:hover { border-color: rgba(92, 232, 255, 0.45); }
    .person .initial { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
    .person .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* La clave de alta (fase 36, en la nube). */
    .login-form { display: grid; gap: 12px; }
    .login-form > p:first-child { color: var(--ink-3); font-size: 13px; }
    .login-field { display: grid; gap: 6px; }
    .login-field > span { color: var(--ink-3); font-size: 12px; font-weight: 600; }
    .login-form .pin-error:empty { display: none; }

    /* PIN: un teclado grande, también cómodo en el celular. */
    .pin-pad { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .pin-pad > p { color: var(--ink-3); text-align: center; font-size: 13px; }
    .pin-dots { display: flex; gap: 14px; padding: 6px 0; }
    .pin-dots span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--accent); }
    .pin-dots span.on { background: var(--accent); }
    .pin-pad.wrong .pin-dots span { border-color: var(--live-ink); }
    .pin-error { min-height: 1.4em; color: var(--live-ink); font-size: 13px; }
    .pin-keys { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; }
    .pin-keys button { height: 64px; border-radius: 22px; border: 1px solid var(--glass-line); background: rgba(255, 255, 255, 0.05); font-size: 22px; font-weight: 600; display: grid; place-items: center; }
    .pin-keys button:active { background: var(--accent-soft); }
  </style>
</head>
<body class="glow">
  <main>
    <header class="lockup">
      <img src="/marca.svg" alt="">
      <p class="wordmark">MANNA</p>
      <p class="version" id="version"></p>
      <h1>¿Qué vas a hacer hoy?</h1>
      <p id="who" hidden></p>
    </header>
    <div id="roles"></div>
    <p class="free">Manna es software libre (<a href="https://github.com/delosriosmedia/manna" target="_blank" rel="noopener">código y licencia AGPL</a>).</p>
  </main>
  <script type="module" src="/roles/home.js"></script>
</body>
</html>
